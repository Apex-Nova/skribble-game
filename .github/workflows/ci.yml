#  OWNER: Person 6 — Lobby UI & infrastructure
# ==================================================================
#
#  WHAT THIS FILE IS
#  -----------------
#  Instructions for GitHub Actions: a robot that runs on GitHub's
#  computers every time someone opens or updates a Pull Request. If it
#  fails, a red ❌ appears on the PR and you know not to merge yet.
#  YAML is indentation-sensitive: use SPACES, never tabs.
#
#  DO THIS LAST-ISH (Day 2–3), once both package.json files exist and
#  package-lock.json files are committed (the robot needs them).
#
#  WHAT TO WRITE (top to bottom)
#  -----------------------------
#  1. `name:` — e.g. "CI". Shows up on GitHub.
#
#  2. `on:` — WHEN to run: on pull_request to main, and on push to main.
#
#  3. `jobs:` — two jobs that run side by side:
#
#     backend job:
#       - runs-on: the latest Ubuntu runner
#       - steps:
#           a. check out the code      (the official "checkout" action)
#           b. install Node            (the official "setup-node" action,
#                                       pick the current LTS version)
#           c. install dependencies    (`npm ci` — like npm install but
#                                       strict; run it inside backend/
#                                       using `working-directory`)
#           d. sanity check            (`node --check server.js` catches
#                                       syntax errors without starting
#                                       the server)
#
#     frontend job:
#       - same a, b, c but in frontend/
#       - d. `npm run build` — if any component has a syntax error or a
#            broken import, the build fails and the PR goes red.
#
#  4. Later (optional): add a lint step (ESLint) to catch unused
#     variables and common mistakes.
#
#  HOW TO TEST IT
#  --------------
#  Open a PR -> "Checks" tab on GitHub -> watch the jobs run.
#  Break something on purpose in a test branch to see it go red.
#
#  LOOK UP: docs.github.com -> "Quickstart for GitHub Actions",
#           "Building and testing Node.js".
