<!--
  ==================================================================
   frontend/public/index.html
   OWNER: Person 6 — Lobby UI & infrastructure
  ==================================================================

   WHAT THIS FILE IS
   -----------------
   The single HTML page the browser loads. React fills it in, so it is
   almost empty. The project generator (Vite / create-react-app) makes
   this for you — you only tweak it.
   (With Vite, this file lives at frontend/index.html, not in public/.)

   WHAT IT NEEDS
   -------------
   - The standard HTML5 skeleton: doctype, html with lang="en", head, body.
   - In <head>:
       * charset meta (UTF-8) — so emojis/names display correctly
       * viewport meta — so it works on phones
       * <title> — the game's name, shown on the browser tab
       * (optional) a favicon
   - In <body>:
       * ONE empty div with id="root". React renders the whole app
         inside it (see src/index.js). If this id is wrong, you get a
         blank white page.
       * a <noscript> message: "You need JavaScript enabled".

   DONE WHEN
   [ ] Browser tab shows the game's title
   [ ] App renders (not a blank page)

   LOOK UP: MDN "Getting started with HTML" -> "Anatomy of an HTML document".
-->
